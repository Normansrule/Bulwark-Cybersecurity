<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" font-family="'IBM Plex Sans',system-ui,sans-serif" role="img" aria-label="Learning path from Foundations to Frontier">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#c8892f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="210" rx="14" fill="#0f1b2d"/>
  <text x="28" y="40" fill="#e8e4da" font-size="20" font-weight="600" font-family="Fraunces,Georgia,serif">The learning path</text>
  <text x="28" y="62" fill="#9aa7b8" font-size="13">History → present → frontier. Each stage links to its lessons.</text>

  <!-- stages -->
  <g>
    <!-- 1 -->
    <rect x="28" y="90" width="128" height="92" rx="10" fill="#14233b" stroke="#243550"/>
    <text x="42" y="116" fill="#c8892f" font-size="13" font-weight="700">01</text>
    <text x="42" y="140" fill="#e8e4da" font-size="14" font-weight="600">Foundations</text>
    <text x="42" y="160" fill="#9aa7b8" font-size="11">Ciphers &amp; how</text>
    <text x="42" y="173" fill="#9aa7b8" font-size="11">they broke</text>
    <!-- 2 -->
    <rect x="176" y="90" width="128" height="92" rx="10" fill="#14233b" stroke="#243550"/>
    <text x="190" y="116" fill="#c8892f" font-size="13" font-weight="700">02</text>
    <text x="190" y="140" fill="#e8e4da" font-size="14" font-weight="600">Core concepts</text>
    <text x="190" y="160" fill="#9aa7b8" font-size="11">CIA triad,</text>
    <text x="190" y="173" fill="#9aa7b8" font-size="11">threat models</text>
    <!-- 3 -->
    <rect x="324" y="90" width="128" height="92" rx="10" fill="#14233b" stroke="#243550"/>
    <text x="338" y="116" fill="#c8892f" font-size="13" font-weight="700">03</text>
    <text x="338" y="140" fill="#e8e4da" font-size="14" font-weight="600">Live crypto</text>
    <text x="338" y="160" fill="#9aa7b8" font-size="11">AES, hashing,</text>
    <text x="338" y="173" fill="#9aa7b8" font-size="11">TLS 1.3</text>
    <!-- 4 -->
    <rect x="472" y="90" width="128" height="92" rx="10" fill="#14233b" stroke="#243550"/>
    <text x="486" y="116" fill="#c8892f" font-size="13" font-weight="700">04</text>
    <text x="486" y="140" fill="#e8e4da" font-size="14" font-weight="600">Applied</text>
    <text x="486" y="160" fill="#9aa7b8" font-size="11">OWASP Top 10,</text>
    <text x="486" y="173" fill="#9aa7b8" font-size="11">auth, network</text>
    <!-- 5 -->
    <rect x="620" y="90" width="128" height="92" rx="10" fill="#14233b" stroke="#243550"/>
    <text x="634" y="116" fill="#c8892f" font-size="13" font-weight="700">05</text>
    <text x="634" y="140" fill="#e8e4da" font-size="14" font-weight="600">Detection</text>
    <text x="634" y="160" fill="#9aa7b8" font-size="11">Logging, ATT&amp;CK,</text>
    <text x="634" y="173" fill="#9aa7b8" font-size="11">blue team</text>
    <!-- 6 -->
    <rect x="768" y="90" width="124" height="92" rx="10" fill="#14233b" stroke="#2f9e8f"/>
    <text x="782" y="116" fill="#2f9e8f" font-size="13" font-weight="700">06</text>
    <text x="782" y="140" fill="#e8e4da" font-size="14" font-weight="600">Frontier</text>
    <text x="782" y="160" fill="#9aa7b8" font-size="11">Post-quantum,</text>
    <text x="782" y="173" fill="#9aa7b8" font-size="11">zero trust</text>
  </g>

  <!-- connectors -->
  <line x1="158" y1="136" x2="174" y2="136" stroke="#c8892f" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="306" y1="136" x2="322" y2="136" stroke="#c8892f" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="454" y1="136" x2="470" y2="136" stroke="#c8892f" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="602" y1="136" x2="618" y2="136" stroke="#c8892f" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="750" y1="136" x2="766" y2="136" stroke="#c8892f" stroke-width="2" marker-end="url(#arw)"/>
</svg>
