<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'IBM Plex Sans',system-ui,sans-serif" role="img" aria-label="Lab sandbox architecture">
  <rect x="0" y="0" width="820" height="300" rx="14" fill="#0f1b2d"/>
  <text x="28" y="40" fill="#e8e4da" font-size="20" font-weight="600" font-family="Fraunces,Georgia,serif">How a lab stays contained</text>

  <!-- learner machine -->
  <rect x="28" y="64" width="470" height="210" rx="12" fill="none" stroke="#3a4a63" stroke-dasharray="4 4"/>
  <text x="44" y="88" fill="#9aa7b8" font-size="12">Learner's machine</text>

  <!-- container -->
  <rect x="56" y="104" width="414" height="150" rx="10" fill="#14233b" stroke="#2f9e8f"/>
  <text x="72" y="128" fill="#2f9e8f" font-size="13" font-weight="700">Lab container</text>
  <text x="72" y="150" fill="#e8e4da" font-size="13">Bundled vulnerable practice app</text>

  <g fill="#9aa7b8" font-size="12">
    <text x="72" y="178">• No outbound network (default)</text>
    <text x="72" y="198">• Read-only base image</text>
    <text x="72" y="218">• Dropped Linux capabilities</text>
    <text x="72" y="238">• CPU / memory / time limits</text>
  </g>

  <!-- internet -->
  <rect x="600" y="140" width="180" height="78" rx="10" fill="#14233b" stroke="#243550"/>
  <text x="690" y="176" fill="#9aa7b8" font-size="14" text-anchor="middle">Internet</text>
  <text x="690" y="196" fill="#9aa7b8" font-size="14" text-anchor="middle">(any other host)</text>

  <!-- blocked arrow -->
  <line x1="470" y1="179" x2="600" y2="179" stroke="#c0563f" stroke-width="2.5"/>
  <g stroke="#c0563f" stroke-width="3">
    <line x1="527" y1="166" x2="543" y2="192"/>
    <line x1="543" y1="166" x2="527" y2="192"/>
  </g>
  <text x="535" y="212" fill="#c0563f" font-size="11" text-anchor="middle">blocked</text>

  <text x="28" y="292" fill="#9aa7b8" font-size="12">No field accepts an external target. The attack step can only reach the bundled app.</text>
</svg>
