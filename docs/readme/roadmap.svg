<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Roadmap: static curriculum and public-release prep done; publishing next; lab runner and desktop app need a host">
<style>
  .ms{opacity:0;animation:rise .6s ease forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .k{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-anchor:middle}
  .g{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;text-anchor:middle}
  .t{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#e8e4da;text-anchor:middle}
  .s{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#9aa7b8;text-anchor:middle}
  .rail{stroke:#26374f;stroke-width:4;stroke-dasharray:6 8}
  .doneline{stroke:#46b3a2;stroke-width:4;stroke-dasharray:194;stroke-dashoffset:194;animation:draw 1.2s ease forwards .4s}
  .nowline{stroke:#d59a45;stroke-width:4;stroke-dasharray:8 10;animation:flow 1.2s linear infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes flow{to{stroke-dashoffset:-36}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.ms{opacity:1}.doneline{stroke-dashoffset:0}}
</style>
<rect width="1200" height="330" rx="18" fill="#0f1b2d"/>
<line x1="115" y1="110" x2="1085" y2="110" class="rail"/>
<line x1="115" y1="110" x2="309" y2="110" class="doneline"/>
<line x1="309" y1="110" x2="503" y2="110" class="nowline"/>
<g class="ms" style="animation-delay:0.00s">
      <circle cx="115" cy="110" r="22" fill="#46b3a2" stroke="#46b3a2" stroke-width="3"/>
      <text x="115" y="117" class="g" style="fill:#0f1b2d">✓</text>
      <text x="115" y="60" class="k" style="fill:#46b3a2">DONE</text>
      <text x="115" y="168" class="t">Static curriculum</text>
      <text x="115" y="196" class="s">27 lessons · 34 widgets</text><text x="115" y="218" class="s">19 CTF challenges</text><text x="115" y="240" class="s">glossary · sources · path map</text></g><g class="ms" style="animation-delay:0.30s">
      <circle cx="309" cy="110" r="22" fill="#46b3a2" stroke="#46b3a2" stroke-width="3"/>
      <text x="309" y="117" class="g" style="fill:#0f1b2d">✓</text>
      <text x="309" y="60" class="k" style="fill:#46b3a2">DONE</text>
      <text x="309" y="168" class="t">Public-release ready</text>
      <text x="309" y="196" class="s">SHA-pinned CI · CodeQL</text><text x="309" y="218" class="s">gitleaks · Dependabot</text><text x="309" y="240" class="s">weekly link check</text></g><g class="ms" style="animation-delay:0.60s"><circle cx="503" cy="110" r="22" fill="none" stroke="#d59a45" stroke-width="3" class="pulse"/>
      <circle cx="503" cy="110" r="22" fill="#16273f" stroke="#d59a45" stroke-width="3"/>
      <text x="503" y="117" class="g" style="fill:#d59a45">3</text>
      <text x="503" y="60" class="k" style="fill:#d59a45">YOU ARE HERE</text>
      <text x="503" y="168" class="t">Publish on GitHub</text>
      <text x="503" y="196" class="s">create the repo + push</text><text x="503" y="218" class="s">enable GitHub Pages</text><text x="503" y="240" class="s">turn on push protection</text></g><g class="ms" style="animation-delay:0.90s">
      <circle cx="697" cy="110" r="22" fill="#16273f" stroke="#9aa7b8" stroke-width="3"/>
      <text x="697" y="117" class="g" style="fill:#9aa7b8">4</text>
      <text x="697" y="60" class="k" style="fill:#9aa7b8">NEXT (STATIC)</text>
      <text x="697" y="168" class="t">Grow the static site</text>
      <text x="697" y="196" class="s">more walkthroughs</text><text x="697" y="218" class="s">per-category API lessons</text><text x="697" y="240" class="s">community contributions</text></g><g class="ms" style="animation-delay:1.20s">
      <circle cx="891" cy="110" r="22" fill="#16273f" stroke="#d97059" stroke-width="3"/>
      <text x="891" y="117" class="g" style="fill:#d97059">⌂</text>
      <text x="891" y="60" class="k" style="fill:#d97059">NEEDS A HOST</text>
      <text x="891" y="168" class="t">Sandboxed lab runner</text>
      <text x="891" y="196" class="s">containers, no egress</text><text x="891" y="218" class="s">real vulnerable targets</text><text x="891" y="240" class="s">graded by the fix</text></g><g class="ms" style="animation-delay:1.50s">
      <circle cx="1085" cy="110" r="22" fill="#16273f" stroke="#d97059" stroke-width="3"/>
      <text x="1085" y="117" class="g" style="fill:#d97059">⌂</text>
      <text x="1085" y="60" class="k" style="fill:#d97059">NEEDS A HOST</text>
      <text x="1085" y="168" class="t">Desktop app</text>
      <text x="1085" y="196" class="s">Tauri/Electron shell</text><text x="1085" y="218" class="s">offline + local labs</text><text x="1085" y="240" class="s">signed releases + SBOM</text></g>
</svg>
