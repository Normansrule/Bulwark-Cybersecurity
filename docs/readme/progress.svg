<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Progress: 27 lessons, 7 eras, 34 widgets, 19 challenges, 17 tests, 84 sources">
<style>
  .h{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#9aa7b8;letter-spacing:.12em}
  .num{font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:48px;opacity:0;animation:pop .6s ease forwards}
  .lab{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;fill:#e8e4da}
  .goal{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#9aa7b8;text-anchor:end}
  .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .live{fill:#46b3a2;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.num{opacity:1}.bar{transform:none}}
</style>
