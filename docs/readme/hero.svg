<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Bulwark: defensive security, from zero">
<style>
  .ct{font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:104px;fill:#d97059;letter-spacing:4px;animation:out .7s ease forwards 1.1s}
  .pt{font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:104px;fill:#e8e4da;letter-spacing:4px;opacity:0;animation:in .7s ease forwards 1.3s}
  @keyframes out{0%{opacity:1}30%{opacity:.6}45%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .shield{fill:none;stroke:#d59a45;stroke-width:5;stroke-linejoin:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.6s ease forwards .2s}
  .check{fill:none;stroke:#46b3a2;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .6s ease forwards 1.6s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .tag{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;fill:#9aa7b8;opacity:0;animation:in .8s ease forwards 1.8s}
  .key{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#d59a45;opacity:0;animation:in .8s ease forwards 2.2s}
  .scan{fill:url(#sg);animation:sweep 5s linear infinite 2s;opacity:0}
  @keyframes sweep{0%{opacity:0;transform:translateX(-200px)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(1300px)}}
  .grid line{stroke:#26374f;stroke-width:1}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.ct{opacity:0}.pt,.tag,.key{opacity:1}.shield,.check{stroke-dashoffset:0}}
</style>
<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#46b3a2" stop-opacity="0"/><stop offset=".5" stop-color="#46b3a2" stop-opacity=".18"/><stop offset="1" stop-color="#46b3a2" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="300" rx="18" fill="#0f1b2d"/>
<g class="grid"><line x1="0" y1="0" x2="0" y2="300"/><line x1="55" y1="0" x2="55" y2="300"/><line x1="110" y1="0" x2="110" y2="300"/><line x1="165" y1="0" x2="165" y2="300"/><line x1="220" y1="0" x2="220" y2="300"/><line x1="275" y1="0" x2="275" y2="300"/><line x1="330" y1="0" x2="330" y2="300"/><line x1="385" y1="0" x2="385" y2="300"/><line x1="440" y1="0" x2="440" y2="300"/><line x1="495" y1="0" x2="495" y2="300"/><line x1="550" y1="0" x2="550" y2="300"/><line x1="605" y1="0" x2="605" y2="300"/><line x1="660" y1="0" x2="660" y2="300"/><line x1="715" y1="0" x2="715" y2="300"/><line x1="770" y1="0" x2="770" y2="300"/><line x1="825" y1="0" x2="825" y2="300"/><line x1="880" y1="0" x2="880" y2="300"/><line x1="935" y1="0" x2="935" y2="300"/><line x1="990" y1="0" x2="990" y2="300"/><line x1="1045" y1="0" x2="1045" y2="300"/><line x1="1100" y1="0" x2="1100" y2="300"/><line x1="1155" y1="0" x2="1155" y2="300"/><line x1="1210" y1="0" x2="1210" y2="300"/></g>
<rect class="scan" x="0" y="0" width="160" height="300"/>
<g transform="translate(150 70)">
  <path class="shield" d="M70 0 L140 26 V86 C140 132 108 160 70 176 C32 160 0 132 0 86 V26 Z"/>
  <path class="check" d="M38 88 L62 112 L104 64"/>
</g>
<text x="330" y="168" class="ct">Ebozdun</text><text x="330" y="168" class="pt">Bulwark</text>
<text x="333" y="222" class="tag">defensive security, from zero · ciphers → today's internet → post-quantum</text>
<text x="333" y="258" class="key">"Ebozdun" is "Bulwark" under a shift-3 Caesar cipher: the first thing you break in lesson one</text>
</svg>
