      <text x="60" y="22" class="an">Docs, CI &amp; supply chain</text>
      <rect x="400" y="8" width="560" height="18" rx="9" fill="#26374f"/>
      <rect x="400" y="8" width="560.0" height="18" rx="9" fill="#46b3a2" class="bar" style="animation-delay:0.45s"/>
      
      <text x="984" y="23" class="pc" style="fill:#46b3a2">100%</text>
      <text x="1042" y="23" class="lb">7 / 7 steps</text></g><g transform="translate(0 312)">
      <text x="60" y="22" class="an">Public launch</text>
