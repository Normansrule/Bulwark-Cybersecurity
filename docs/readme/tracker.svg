      <rect x="400" y="8" width="560" height="18" rx="9" fill="#26374f"/>
      <rect x="400" y="8" width="112.0" height="18" rx="9" fill="#d97059" class="bar" style="animation-delay:0.75s"/>
      <rect x="400" y="8" width="112.0" height="18" rx="9" fill="url(#shine)" class="shine" style="animation-delay:0.75s"/>
      <text x="984" y="23" class="pc" style="fill:#d97059">20%</text>
      <text x="1042" y="23" class="lb">1 / 5 steps</text></g><g transform="translate(0 420)">
