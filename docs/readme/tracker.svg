      <rect x="400" y="8" width="354.7" height="18" rx="9" fill="#d59a45" class="bar" style="animation-delay:0.30s"/>
      <rect x="400" y="8" width="354.7" height="18" rx="9" fill="url(#shine)" class="shine" style="animation-delay:0.30s"/>
