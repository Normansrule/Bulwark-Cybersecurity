<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An open-source, defensive cybersecurity learning platform: from classical ciphers to post-quantum, with interactive widgets and safe attack-then-defend labs.">

  <!-- Strict Content Security Policy. No inline scripts or styles anywhere; the
       app models the practices it teaches. Scripts and styles load only from this
       origin; fonts from Google Fonts; nothing else, and no form may post off-site.
       frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag,
       so it must be sent as a response header (see docs/SECURITY.md). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data:;
    frame-src 'self';
    connect-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'">

  <title>Bulwark</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

  <script src="js/theme-init.js"></script>
</head>
