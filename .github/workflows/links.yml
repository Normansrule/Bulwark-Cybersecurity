name: link-check

# Cited sources rot. Check them weekly and on demand; failures open no PRs,
# they just show red so a maintainer can update the URL and "last verified" date.
on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude-path node_modules
            './**/*.md' 'js/content.js' 'js/app.js' 'index.html'
          fail: true
